plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.hibernate.orm' version '6.6.22.Final'
    id 'org.graalvm.buildtools.native' version '0.10.6'
    id 'jacoco'
}

group = 'com.profect'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    poiVersion = '5.2.4'
    xmlbeansVersion = '5.1.1'
}

dependencies {
    // ===== Core Spring Boot =====
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // ===== Database =====
    implementation 'org.postgresql:postgresql:42.5.4'
    testImplementation 'com.h2database:h2'


    // ===== MyBatis=====
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    implementation 'org.mybatis:mybatis:3.5.19'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.3' //

    // ===== API Documentation (Swagger-ui) =====
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.4'

    // ===== Development Tools =====
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // ===== Annotation Processing =====
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ===== Test Dependencies =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test:5.1.3'
    testImplementation "org.mockito:mockito-inline:5.2.0"
    
    // ===== Locust Performance Testing =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.3.2'
    testImplementation 'org.python:jython-standalone:2.7.3'
    testImplementation "org.testcontainers:junit-jupiter:1.20.1"
    testImplementation "org.testcontainers:postgresql:1.20.1"

    // ===== Jwt Dependencies =====
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    
    // ===== RabbitMQ Dependencies =====
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    
    // ===== Kafka Dependencies ===== (제거됨 - RabbitMQ 단일 아키텍처 사용)
    // implementation 'org.springframework.kafka:spring-kafka'

    // ===== WebSocket =====
    implementation 'org.springframework:spring-websocket'
    implementation 'org.springframework:spring-messaging'

    // ==== Payment ====
    implementation 'io.github.bootpay:backend:+'

    // ==== thymeleaf ====
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // AWS S3 SDK
    implementation 'software.amazon.awssdk:s3:2.20.26'
    implementation 'software.amazon.awssdk:auth:2.20.26'
    implementation 'software.amazon.awssdk:regions:2.20.26'

    // 엑셀 다운로드
    implementation "org.apache.poi:poi:${poiVersion}"
    implementation "org.apache.poi:poi-ooxml:${poiVersion}"
    implementation "org.apache.xmlbeans:xmlbeans:${xmlbeansVersion}"

    // 1) 운영용 엔드포인트(ex: health, info, loggers, metrics...) 노출
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    // 2) Micrometer → Prometheus 연동 레지스트리
    implementation "io.micrometer:micrometer-registry-prometheus"

    //ES 설정
    implementation "co.elastic.clients:elasticsearch-java:8.11.1"
    implementation "org.apache.httpcomponents.client5:httpclient5:5.2"
    implementation "com.fasterxml.jackson.core:jackson-databind"


    implementation 'org.apache.commons:commons-pool2:2.12.0'  // ★ 추가
}

hibernate {
    enhancement {
        enableAssociationManagement = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// AOT 비활성화 (테스트)
tasks.matching { it.name == "processTestAot" }.configureEach {
    enabled = false
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'   // 클래스 단위로 검사
            enabled = true      // 규칙 활성화

            // 각 클래스의 라인 커버리지가 최소 60% 이상이어야 한다
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }

            // 각 클래스의 메서드 커버리지가 최소 60% 이상이어야 한다
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

